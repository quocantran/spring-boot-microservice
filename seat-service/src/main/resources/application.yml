server:
  port: ${SEAT_SERVICE_PORT:5002}

spring:
  application:
    name: seat-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/seat_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9094}
    consumer:
      group-id: seat-service-group
      auto-offset-reset: earliest

jwt:
  secret: ${JWT_SECRET:movie-booking-jwt-secret-key-2026}

debezium:
  host: ${DEBEZIUM_HOST:localhost:8083}
  auto-register: false
