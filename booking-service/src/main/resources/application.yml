server:
  port: ${BOOKING_SERVICE_PORT:5001}

spring:
  application:
    name: booking-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/booking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9094}
    consumer:
      group-id: booking-service-group
      auto-offset-reset: earliest

jwt:
  secret: ${JWT_SECRET:movie-booking-jwt-secret-key-2026}

debezium:
  host: ${DEBEZIUM_HOST:localhost:8083}
  auto-register: true
