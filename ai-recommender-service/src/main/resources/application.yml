server:
  port: ${AI_RECOMMENDER_SERVICE_PORT:5006}

spring:
  application:
    name: ai-recommender-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/ai_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9094}
    consumer:
      group-id: ai-recommender-service-group
      auto-offset-reset: earliest

jwt:
  secret: ${JWT_SECRET:movie-booking-jwt-secret-key-2026}

movie-service:
  url: ${MOVIE_SERVICE_URL:http://localhost:5003}

debezium:
  host: ${DEBEZIUM_HOST:localhost:8083}
  auto-register: false

# Resilience4j — Circuit Breaker + Retry for movie-service REST call
resilience4j:
  circuitbreaker:
    instances:
      movieService:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        registerHealthIndicator: true
  retry:
    instances:
      movieService:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.net.ConnectException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
