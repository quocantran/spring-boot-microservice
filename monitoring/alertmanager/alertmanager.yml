# Alertmanager Configuration
# SLACK_WEBHOOK_PLACEHOLDER is replaced at container startup via sed
# The real webhook URL comes from the SLACK_WEBHOOK_URL environment variable

global:
  resolve_timeout: 5m
  slack_api_url: 'SLACK_WEBHOOK_PLACEHOLDER'

route:
  receiver: 'slack-notifications'
  group_by: ['alertname', 'severity', 'job']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: 'slack-notifications'
      repeat_interval: 1h

receivers:
  - name: 'slack-notifications'
    slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔥 FIRING{{ else }}✅ RESOLVED{{ end }} [{{ .CommonLabels.severity | toUpper }}]'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}

          *Severity:* `{{ .Labels.severity }}`

          *Service:* {{ .Labels.job }} ({{ .Labels.instance }})

          *Value:* {{ .Annotations.current_value }}

          *Threshold:* {{ .Annotations.threshold }}

          *Description:* {{ .Annotations.description }}

          ---
          {{ end }}
        icon_emoji: '{{ if eq .Status "firing" }}:fire:{{ else }}:white_check_mark:{{ end }}'
